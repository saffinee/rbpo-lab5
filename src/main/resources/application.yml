spring:
  application:
    name: parking-lab4
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET}
